<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Banik Hardware">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Banik Hardware · Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>

<body class="login-body">

  <div class="login-card">

    <div class="login-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
        </path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="login-mark">Banik Hardware</div>
    <p class="login-sub">Inventory &amp; Pricing Management System</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" class="login-form" autocomplete="on">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" autofocus placeholder="Enter your username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" placeholder="Enter your password"
          required>
      </label>
      <button type="submit">Sign In</button>
    </form>

    <div class="login-divider">System Access</div>
    <p class="login-hint">
      Admin: <strong>admin</strong> / <strong>admin123</strong><br>
      Viewer: <strong>user</strong> / <strong>user123</strong>
    </p>

  </div>

</body>

</html>
